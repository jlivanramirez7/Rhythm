<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#9c4a2d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Rhythm - Login</title>
    <link rel="stylesheet" href="/styles.css?v=1.9">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
</head>
<body class="centered">
    <div class="login-container">
        <img src="/logo.png?v=2" alt="Rhythm Logo" class="logo">
        <h1>Rhythm</h1>
        <p>Natural Family Planning Made Easy.</p>
        <a href="/auth/google" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
            Sign in with Google
        </a>
        <a href="/register" class="google-btn" style="background-color: #333; color: white; margin-top: 10px;">
            Register
        </a>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 20px; text-transform: lowercase;">now powered by anti-gravity</p>
    </div>
</body>
</html>
